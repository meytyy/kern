[package]
name = "kern"
version = "0.1.3"
edition = "2024"
description = "KERN — native IDE written in Rust"
license = "MIT"
default-run = "kern"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.104"
base64 = "0.22"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
env_logger = "0.11.11"
futures = "0.3.34"
gpui-kit = { version = "=0.9.0", features = ["tree-sitter", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-html", "tree-sitter-css", "tree-sitter-yaml", "tree-sitter-toml", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-swift", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-cmake", "tree-sitter-bash"] }
ignore = "0.4.34"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff", "jpeg"] }
libc = "0.2.191"
log = "0.4.35"
lsp-types = { version = "0.97", features = ["proposed"] }
notify = "8.2.1"
once_cell = "1.21.4"
open = "5.4.5"
parking_lot = "0.13.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
smallvec = "1"
similar = "3.2.1"
tree-sitter-c = "=0.24.2"
tree-sitter-cmake = "=0.7.6"
tree-sitter-cpp = "=0.23.4"
tree-sitter-javascript = "=0.23.1"
tree-sitter-swift = "=0.7.4"
tree-sitter-typescript = "=0.23.2"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
tree-sitter-c-sharp = "=0.23.5"
ed25519-dalek = "2"
sha2 = "0.10"

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
getrandom = "0.3"
tempfile = "3.27.0"
tree-sitter = "0.26"

[features]
# Scripted UI driver used to verify flows in a real window. Not part of release builds.
autotest = []

# Cross-build of the Windows EXE from macOS. The GPUI Windows renderer
# precompiles its shaders with fxc.exe, which exists only on Windows; with debug
# assertions it compiles them at startup through d3dcompiler_47.dll instead
# (part of Windows 10 and 11). A build on Windows itself uses `--release`.
[profile.xwin]
inherits = "release"

[profile.xwin.package.gpui-pre-windows]
debug-assertions = true
